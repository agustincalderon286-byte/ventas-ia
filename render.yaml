services:
  - type: web
    name: cmwf-crm-api
    runtime: node
    buildCommand: npm ci --omit=dev --prefer-offline --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/healthz
    maxShutdownDelaySeconds: 300
    autoDeploy: true
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_BASE_URL
        value: https://totalelitecoaching.com
      - key: CONTROL_TOWER_ACCESS_EMAILS
        value: agustincalderon286@gmail.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_ANNUAL
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: METALWORKS_ASSISTANT_MAX_MESSAGES_PER_DAY
        value: "20"
      - key: METALWORKS_CRM_PASSWORD
        sync: false
      - key: METALWORKS_CRM_ALLOWED_EMAILS
        value: agustincalderon423@gmail.com,agustincalderon286@gmail.com
      - key: SEARCHKINGS_SMS_EMAIL_TOKEN
        sync: false
